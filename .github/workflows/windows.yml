name: Compilar BrisaDock para Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Compilar el portable
        shell: pwsh
        run: ./construir-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: BrisaDock-Windows-x64-unsigned
          path: dist/BrisaDock
          if-no-files-found: error
